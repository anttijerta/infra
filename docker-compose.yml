x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    # Only Caddy publishes ports. Docker-published ports bypass ufw.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: ${ENV_DIR:-/etc/demos}/caddy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      demos:
        # Fixed address so apps can trust X-Forwarded-For from Caddy only.
        ipv4_address: 172.30.0.2
    logging: *logging

  waste-sorter:
    # Trade-off: defaults to the mutable "latest" tag for convenience. Set
    # WASTE_SORTER_TAG in .env to a version or commit SHA to pin the image.
    image: ghcr.io/anttijerta/waste-sorter:${WASTE_SORTER_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3333"
    env_file: ${ENV_DIR:-/etc/demos}/waste-sorter.env
    environment:
      # Caddy's address on the demos network. Set here, next to the subnet,
      # so it cannot drift; overrides any value in the env file.
      TRUSTED_PROXIES: 172.30.0.2
    networks:
      - demos
    volumes:
      # SQLite database lives at /app/data/db.sqlite3.
      - waste_sorter_data:/app/data
    healthcheck:
      # The image has no curl or wget, so use Node's fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging: *logging

networks:
  demos:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dynamic addresses come from the upper half only, so no container
          # can take Caddy's static 172.30.0.2.
          ip_range: 172.30.0.128/25

volumes:
  caddy_data:
  caddy_config:
  waste_sorter_data:
